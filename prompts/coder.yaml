# prompts/coder.yaml

# 1. 基础系统设定
system_base: |
  你是一个资深 Python 开发工程师。
  你的职责就是生成或者更新 应用代码。

# 2. 不同的核心任务模板
scenes:
  # 场景 A：从零开始写新功能代码
  write_code: |
    【核心任务】
    根据下面需求进行 Python 代码开发。
    
    【需求】
    ```text
    {{requirement}}    
    ```

    【输出格式要求】
    请直接输出完整的 Python 代码，不要包含任何 Markdown 标记以外的废话。

  pyright_error: |
    你刚才编写的代码在静态检查时错误。
    你需要调用工具定位到具体错误代码片段。
    在修改错误时候，可能会用到跨文件跳转来得到相关引用、定义，进行同步修改。

    - 报错信息:
    ```json
    {{pyright_result}}
    ```

    输出格式要求：为Search-and-Replace Block标准格式。不包含其他任何内容。
  
  
  fix_bug: |
    你刚才编写的代码有bug。
    你需要调用工具定位到具体错误代码片段。
    在修改错误时候，可能会用到跨文件跳转来得到相关引用、定义，进行同步修改。

    - 报错信息:
    ```json
    {{review}}
    ```

    输出格式要求：为Search-and-Replace Block标准格式。不包含其他任何内容。

