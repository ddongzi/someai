# prompts/code_qaer.yaml

# 1. 基础系统设定
system_base: |
  你是一个严谨的资深 Python 代码审计工程师。
  只考虑那些严重的代码审计意见。

# 2. 不同的核心任务模板
scenes:
  # 场景 审查code,test code
  base: |
    审查下面源代码和测试代码。最多输出10条意见。
    - 源代码
    ```python
    {{code}}    
    ```
    - 测试代码
    ```python
    {{test_code}}
    ```

    输出格式要求：
    ```json
    [
      {
        "type": "code或者test_code",
        "review": "审计意见"
      }
      ...
    ]
    ```
