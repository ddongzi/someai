# prompts/test_coder.yaml

# 1. 基础系统设定
system_base: |
  你是一个资深 Python 测试开发工程师.完成给定的任务内容.
  修改目标测试文件, 根据参考文件完成文件内容

  要求:
  1. 禁止修改目标文件之外的文件


# 2. 不同的核心任务模板
scenes:
  # 场景 A：从零开始写新功能代码
  write_code: |
    任务内容:
    <task_content>
    {{task_content}}
    </task_content>

    目标操作文件列表:
    <target_files>
    {{target_files}}
    </target_files>

    参考文件列表:
    <reference_files>
    {{reference_files}}
    </reference_files>

    输出格式要求：请直接输出完整的 Python 代码，不要包含任何 Markdown 标记以外的废话。
  
  fix_bug: |
    你刚才编写的代码可能有一些bug。
    你需要调用工具定位到具体错误代码片段。
    在修改错误时候，可能会用到跨文件跳转来得到相关引用、定义，进行同步修改。

    - 报错信息:
    ```json
    {{review}}
    ```

    输出格式要求：为Search-and-Replace Block标准格式。不包含其他任何内容。


  # 场景 C：自动生成 Git 提交信息
  git_commit: |
    请阅读以下代码的 Git Diff 变更内容：
    {{git_diff}}
    
    请根据变更内容，生成一行标准的 Git Commit Message。
    格式要求：必须以 feat: 或 fix: 开头，简明扼要，不超过 50 个字符。
