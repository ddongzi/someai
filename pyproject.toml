[project]
name = "llai-root"
version = "0.1.0"
description = "大总管根项目"
dependencies = [
    "autogen-agentchat>=0.2.40",
    "autogenstudio",
    "cryptography>=48.0.0",
    "fastapi>=0.136.3",
    "grandalf>=0.8",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langgraph-cli[dev,inmem]>=0.4.29",
    "langgraph-sdk>=0.3.15",
    "pydantic>=2.13.4",
    "pygame>=2.6.1",
    "pytest>=9.0.3",
    "streamlit>=1.58.0",
    "uvicorn>=0.49.0",
] # 根目录本身可以不装任何包

# 💡 核心：告诉 uv，下面这些子目录都是我的人
[tool.uv]
workspace = { members = ["demoo", "llai", "langrensha"] }


[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
